name = "le888app"
main = "index.ts"
compatibility_date = "2026-09-01"

# ---- Static files (index.html, admin.html, sw.js, icons) ----
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "single-page-application"

# ---- Your database (already created + filled) ----
[[d1_databases]]
binding = "DB"
database_name = "le888-db"
database_id = "32eef1de-d554-42dd-8c3c-bbec2a593eb4"

# ---- Daily background job (04:00 UTC = 12:00 Singapore time) ----
[triggers]
crons = ["0 4 * * *"]

# ---- Image storage (R2): chat photos, deposit receipts, PayNow QR, logos, banners.
# Bucket "le888-images" was created in Cloudflare -> R2 Object Storage.
[[r2_buckets]]
binding = "CHAT_IMAGES"
bucket_name = "le888-images"

# ---- Custom domain (add AFTER first deploy) ----
# routes = [
#   { pattern = "app.YOURNEWDOMAIN.com", custom_domain = true }
# ]
